name: Build Nova 3D iOS & iPadOS (IPA)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ipa:
    name: Build IPA on Cloud macOS
    runs-on: macos-latest # Standard Apple Silicon runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build Rust Core (aarch64-apple-ios)
        run: |
          cd rust/nova_core
          cargo build --release --target aarch64-apple-ios
          mkdir -p ../../ios/Nova3D/Libraries
          cp target/aarch64-apple-ios/release/libnova_core.a ../../ios/Nova3D/Libraries/
          mkdir -p ../../ios/Nova3D/Include
          cp ../../native/include/nova_core.h ../../ios/Nova3D/Include/

      - name: Build Xcode Archive
        run: |
          cd ios
          xcodebuild clean archive \
            -project Nova3D.xcodeproj \
            -scheme Nova3D \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Nova3D.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Create .IPA Package
        run: |
          cd ios
          mkdir -p build/Payload
          cp -R build/Nova3D.xcarchive/Products/Applications/Nova3D.app build/Payload/
          cd build
          zip -qr Nova3D.ipa Payload
          echo "IPA created successfully: $(pwd)/Nova3D.ipa"
          ls -lh Nova3D.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nova3D-iPadOS-iOS
          path: ios/build/Nova3D.ipa
          retention-days: 14
